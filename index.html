<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffb6c1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dumpling" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <title>Mi Dumpling — Diseña tu dumpling</title>
</head>
<body>
  <div id="app">

    <!-- ============== SCREEN: HOME ============== -->
    <section class="screen" data-screen="home">
      <header class="topbar">
        <div class="title-wrap">
          <h1 class="title">🥟 Mis Dumplings</h1>
          <p class="subtitle">Diseña, guarda y comparte</p>
        </div>
      </header>

      <div class="home-body">
        <button class="create-btn" id="btn-create">
          <span class="create-emoji">✨</span>
          <span>Crear un nuevo dumpling</span>
        </button>

        <div class="collection" id="collection">
          <!-- Saved dumplings render here -->
        </div>
      </div>
    </section>

    <!-- ============== SCREEN: DESIGNER ============== -->
    <section class="screen" data-screen="design" hidden>
      <header class="topbar">
        <button class="icon-btn ghost" id="btn-back-home" aria-label="Volver">
          <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
        <h1 class="title">Diseña tu dumpling</h1>
        <div style="width:42px"></div>
      </header>

      <div class="preview" id="preview">
        <div class="preview-svg" id="preview-svg"></div>
      </div>

      <nav class="steps" id="steps" role="tablist">
        <button class="step-tab active" data-step="color">🎨 Color</button>
        <button class="step-tab" data-step="eyes">👀 Ojos</button>
        <button class="step-tab" data-step="mouth">👄 Boca</button>
        <button class="step-tab" data-step="blush">😊 Cachetes</button>
        <button class="step-tab" data-step="accessories">🎀 Accesorios</button>
        <button class="step-tab" data-step="box">📦 Cajita</button>
        <button class="step-tab" data-step="boxColor">🌈 Color caja</button>
        <button class="step-tab" data-step="name">📝 Nombre</button>
      </nav>

      <div class="options" id="options"></div>

      <footer class="footer-actions">
        <button class="btn ghost" id="btn-prev">← Atrás</button>
        <button class="btn primary" id="btn-next">Siguiente →</button>
      </footer>
    </section>

    <!-- ============== SCREEN: REVEAL ============== -->
    <section class="screen reveal-screen" data-screen="reveal" hidden>
      <div class="reveal-stage" id="reveal-stage">
        <div class="confetti" id="confetti"></div>
        <div class="reveal-name" id="reveal-name"></div>
        <div class="reveal-box" id="reveal-box"></div>
      </div>

      <footer class="reveal-actions" id="reveal-actions" hidden>
        <button class="btn primary big" id="btn-share">📲 Compartir / Descargar</button>
        <button class="btn" id="btn-save">💾 Guardar en mi colección</button>
        <button class="btn ghost" id="btn-new-after">✨ Crear otro</button>
      </footer>

      <div class="reveal-tap-hint" id="reveal-tap-hint">Toca para abrir la caja</div>
    </section>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Install banner -->
    <div class="install-banner" id="install-banner" hidden>
      <span>¡Instala la app en tu teléfono!</span>
      <button class="btn small" id="btn-install">Instalar</button>
      <button class="icon-btn small ghost" id="btn-dismiss-install" aria-label="Cerrar">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      </button>
    </div>

  </div>

  <script src="js/app.js" type="module"></script>
</body>
</html>
